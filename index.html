<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fish 島 FISH ISLAND</title>
    <meta name="description" content="用 3D 六角島嶼認識 Fish：16 年前端開發、技能、精選作品與 300+ 作品總覽。" />
    <link rel="canonical" href="https://fishtoyo.github.io/star-island/" />
    <meta name="theme-color" content="#164e81" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fish 島 FISH ISLAND" />
    <meta property="og:description" content="用 3D 六角島嶼認識 Fish：16 年前端開發、技能、精選作品與 300+ 作品總覽。" />
    <meta property="og:url" content="https://fishtoyo.github.io/star-island/" />
    <meta property="og:image" content="https://fishtoyo.github.io/star-island/assets/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,4 94,27 94,73 50,96 6,73 6,27' fill='%23164e81'/%3E%3Ctext x='50' y='66' font-size='46' text-anchor='middle' fill='white'%3E%E2%98%85%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" />
    <link rel="stylesheet" href="./assets/css/theme.css" />
    <link rel="stylesheet" href="./assets/css/ui.css" />
    <script>
      // 盡早套用上次選的色系，避免畫面閃一下
      try {
        const t = localStorage.getItem("star-island-theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "./assets/vendor/three/build/three.module.js",
          "three/addons/": "./assets/vendor/three/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./assets/js/app.js"></script>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">★</span>
          <div>
            <p class="brand-kicker" id="kicker">FISH ISLAND</p>
            <h1 id="headline">嗨，我是 Fish</h1>
          </div>
        </div>
        <nav class="modes" aria-label="瀏覽模式">
          <button type="button" class="mode is-on" data-mode="map" aria-pressed="true"><span aria-hidden="true">⬡</span> 全景</button>
          <button type="button" class="mode" data-mode="list" aria-pressed="false"><span aria-hidden="true">☰</span> 清單</button>
        </nav>
      </header>

      <div class="toolbar">
        <label class="search">
          <span class="sr-only">搜尋</span>
          <input id="search" type="search" placeholder="搜尋主題、關鍵字…" autocomplete="off" />
        </label>
        <div id="tags" class="tags" role="group" aria-label="標籤篩選"></div>
        <div class="tools">
          <button type="button" id="btn-tour" class="tool" aria-pressed="false">導覽</button>
          <button type="button" id="btn-links" class="tool" aria-pressed="false">協作線</button>
          <button type="button" id="btn-theme" class="tool">色系</button>
          <button type="button" id="btn-reset" class="tool">重置視角</button>
        </div>
      </div>

      <main id="stage"></main>

      <p class="hint" id="hint"><span id="lead">16 年前端開發、12 年遠端工作、300+ 專案，一座島一段經歷。</span> <span class="hint-how">拖曳旋轉・滾輪縮放・點一座島開始探索</span></p>
      <p class="count" id="count" aria-live="polite"></p>

      <aside id="panel" class="panel" aria-label="主題詳情" hidden>
        <button type="button" class="panel-close" id="panel-close" aria-label="關閉">✕</button>
        <div id="panel-body"></div>
      </aside>

      <section id="list" class="list" aria-label="主題清單" hidden>
        <div class="list-inner">
          <p class="list-kicker">THE INDEX</p>
          <h2>所有主題</h2>
          <p class="list-note" id="note"></p>
          <div id="list-grid" class="list-grid"></div>
        </div>
      </section>

      <div id="loading" class="loading">
        <span class="loading-mark" aria-hidden="true">★</span>
        <p id="loading-text">正在組合島嶼…</p>
      </div>
    </div>
  </body>
</html>
